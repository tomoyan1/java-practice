<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajaxzip3.github.io/ajaxzip3.js" charset="UTF-8"></script>
    <link rel="stylesheet" href="employee_detail_edit.css">
    <title>社員情報詳細</title>
</head>

<body>
    <header>
        <div id="header" class="header-area">
            <div class="menu-button flex-child">
                <button>
                    メニュー
                </button>
            </div>
            <span class="header-spacer"></span>
            <div class="user-label flex-child">
                橋本将馬
            </div>
            <div class="logout-button flex-child">
                <button>
                    ログアウト
                </button>
            </div>
        </div>
    </header>
    <div class="main-area">
        <div class="employee-detail-edit-area">
            <h1>詳細情報</h1>
            <div class="table-area">
                <table class="employee-detail-edit-table">
                    <tbody>
                        <tr>
                            <td>
                                社員番号
                            </td>
                            <td>
                                0001
                            </td>
                        </tr>
                        <tr>
                            <td>
                                姓
                            </td>
                            <td>
                                <input type="text" name="lastName">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                名
                            </td>
                            <td>
                                <input type="text" name="firstName">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                生年月日
                            </td>
                            <td>
                                <input type="date" name="birth" class="birth">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                性別
                            </td>
                            <td>
                                男<input type="radio" name="sex" value="0">
                                女<input type="radio" name="sex" value="1">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                電話番号
                            </td>
                            <td>
                                <input type="tel" name="tel">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                メールアドレス
                            </td>
                            <td>
                                <input type="email" name="email">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                郵便番号
                            </td>
                            <td>
                                <input type="text" name="postalCode" onkeyup="AjaxZip3.zip2addr(this,'','city','adress1');"><br>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                都道府県
                            </td>
                            <td>
                                <input type="text" name="city"><br>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                市区町村
                            </td>
                            <td>
                                <input type="text" name="adress1"><br>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                以降の住所
                            </td>
                            <td>
                                <textarea type="text" name="adress2"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                入社年月日
                            </td>
                            <td>
                                <input type="date" name="joiningDay" class="joiningDay">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                趣味
                            </td>
                            <td>
                                <textarea type="text" name="hobby"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                特技
                            </td>
                            <td>
                                <textarea type="text" name="talent"></textarea>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="empoyee-auth-edit-area">
            <h1>ユーザ権限</h1>
            <div class="table-area">
                <table class="employee-auth-edit-table">
                    <tbody>
                        <tr>
                            <td>
                                会社情報
                            </td>
                            <td>
                                <input type="radio" name="company" value="0">参照
                            </td>
                            <td>
                                <input type="radio" name="company" value="1">編集
                            </td>
                        </tr>
                        <tr>
                            <td>
                                社員情報
                            </td>
                            <td>
                                <input type="radio" name="personal" value="0">個人
                            </td>
                            <td>
                                <input type="radio" name="personal" value="1">一覧
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer-area">
            <span class="footer-spacer"></span>
            <div class="back-button flex-child">
                <button>
                    戻る
                </button>
            </div>
            <div class="create-button flex-child">
                <button>
                    登録
                </button>
            </div>
        </div>
    </footer>
</body>

</html>
